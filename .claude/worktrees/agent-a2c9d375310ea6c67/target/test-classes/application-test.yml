spring:
  application:
    name: financial-messaging-platform-test

  datasource:
    url: jdbc:tc:postgresql:16:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    user:
      name: test
      password: test

logging:
  level:
    root: WARN
    com.bank.messaging: DEBUG
