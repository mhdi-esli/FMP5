server:
  port: 8080

spring:
  application:
    name: financial-messaging-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/messaging
    username: messaging_user
    password: messaging_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://sso.tps.ir/.well-known/openid-configuration/jwks

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSS}","level":"%level","logger":"%logger{36}","message":"%msg","correlationId":"%X{correlationId:-}%n"}'
  level:
    root: INFO
    com.bank.messaging: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
